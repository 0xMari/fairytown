<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Fairytown</title>
    <meta
      name="description"
      content="Procedural fairy world starter with placeholder biomes and flying controls."
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <section
      class="mobile-unsupported"
      id="mobile-unsupported"
      aria-labelledby="mobile-unsupported-title"
      hidden
    >
      <div class="mobile-unsupported__content">
        <h1 class="mobile-unsupported__title" id="mobile-unsupported-title">
          Mobile navigation is not yet supported.
        </h1>
        <p class="mobile-unsupported__body">
          This experience is designed for mouse and keyboard exploration.
          Please visit from a desktop or laptop.
        </p>
      </div>
    </section>
    <div class="entry-screen" id="entry-screen">
      <div class="entry-screen__card">
        <p class="entry-screen__body" id="entry-message" aria-live="polite">
          Summoning mushrooms...
        </p>
        <div
          class="entry-screen__progress"
          id="entry-progress"
          role="progressbar"
          aria-label="Loading world"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <p class="entry-screen__status" id="entry-status">0%</p>
          <div class="entry-screen__progress-track" aria-hidden="true">
            <span class="entry-screen__progress-fill" id="entry-progress-fill"></span>
          </div>
        </div>
        <div
          class="entry-screen__controls"
          aria-label="Navigation commands"
          aria-hidden="true"
        >
          <p>Move/WASD</p>
          <p>Rise/Space</p>
          <p>Drop/C</p>
          <p>Boost/Shift</p>
          <p>Look/Mouse</p>
        </div>
        <button
          type="button"
          class="entry-screen__button"
          id="enter-world-button"
          disabled
          hidden
        >
          Take flight
        </button>
      </div>
    </div>
    <div class="hud">
      <div class="hud__status">
        <p id="biome-name">Biome: Sunlit Meadow</p>
        <p id="chunk-count">Loaded chunks: 0</p>
      </div>
    </div>
    <div class="crosshair is-hidden" id="crosshair" aria-hidden="true"></div>
  </body>
</html>
